services:
  newsroom-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cn-express-backend
    ports:
      - "4000:4000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BACKEND_PORT=4000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - MAPS_API_KEY=${MAPS_API_KEY}
    volumes:
      - newsroom_sqlite:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - newsroom_net

  newsroom-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cn-nextjs-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://newsroom-backend:4000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - MAPS_API_KEY=${MAPS_API_KEY}
      - NEXT_PUBLIC_MAPS_API_KEY=${NEXT_PUBLIC_MAPS_API_KEY}
    volumes:
      - newsroom_sqlite:/app/data
    depends_on:
      newsroom-backend:
        condition: service_healthy
    networks:
      - newsroom_net

volumes:
  newsroom_sqlite:

networks:
  newsroom_net:
    driver: bridge
