services:
  newsroom-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cn-express-backend
    ports:
      - "4000:4000"
    restart: unless-stopped
    environment:
      - BACKEND_PORT=4000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6K3gG5aZbZZ3Ck1P0rmU5SGwryQzpaG5cLfrs0uU3FKqw}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
    volumes:
      - newsroom_sqlite:/app/data
    networks:
      - newsroom_net

  newsroom-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cn-nextjs-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://newsroom-backend:4000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6K3gG5aZbZZ3Ck1P0rmU5SGwryQzpaG5cLfrs0uU3FKqw}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
    volumes:
      - newsroom_sqlite:/app/data
    depends_on:
      - newsroom-backend
    networks:
      - newsroom_net

volumes:
  newsroom_sqlite:

networks:
  newsroom_net:
    driver: bridge
